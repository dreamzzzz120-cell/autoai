name: Security, diagnostic benchmark and build gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Permanent security guard
        run: npm run security:guard

      - name: Diagnostic benchmark
        run: npm run diagnostic:benchmark

      - name: Diagnostic adversarial gate
        run: npm run diagnostic:adversarial

      - name: Shop security benchmark
        run: npm run shop:benchmark

      - name: Front desk security benchmark
        run: npm run frontdesk:benchmark

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Formatting check
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Typecheck and production build
        run: npm run build
